<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriCalc Pro - Registro Nutricional Ligero</title>
    <style>
        :root {
            --verde: #006341;
            --verde-oscuro: #00472e;
            --fondo: #f4f7f5;
            --tarjeta: #ffffff;
            --texto: #1f2933;
            --borde: #d9e2ec;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--fondo);
            color: var(--texto);
            padding: 20px;
        }
        .contenedor {
            max-width: 840px;
            margin: 0 auto;
        }
        header {
            background-color: var(--verde);
            color: #ffffff;
            padding: 18px 22px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        header h1 {
            margin: 0 0 6px 0;
            font-size: 1.5rem;
        }
        header p {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.92;
        }
        .panel {
            background: var(--tarjeta);
            border: 1px solid var(--borde);
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 20px;
        }
        .fila {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }
        .campo {
            flex: 1 1 170px;
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 4px;
        }
        input, select {
            padding: 9px 10px;
            border: 1px solid var(--borde);
            border-radius: 6px;
            font-size: 0.95rem;
        }
        button {
            background-color: var(--verde);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: var(--verde-oscuro);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--tarjeta);
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid var(--borde);
            text-align: left;
            font-size: 0.92rem;
        }
        th {
            background-color: #eef3f0;
        }
        .resumen-box {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
            font-size: 1.05rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <header>
            <h1>NutriCalc Pro — Calculadora Nutricional Ligera</h1>
            <p>CECyTEC Plantel 5 Coyote | Grupo 302 | HTML5 + CSS + JS en GitHub</p>
        </header>

        <section class="panel">
            <h2>Registrar Alimento</h2>
            <form id="form-nutri">
                <div class="fila">
                    <div class="campo">
                        <label for="alimento">Alimento base</label>
                        <select id="alimento" required>
                            <option value="Avena cocida (100g)|68|2.4">Avena cocida 100g (68 kcal | 2.4g prot.)</option>
                            <option value="Pechuga de pollo asada (100g)|165|31.0">Pechuga de pollo asada 100g (165 kcal | 31g prot.)</option>
                            <option value="Manzana fresca (100g)|52|0.3">Manzana fresca 100g (52 kcal | 0.3g prot.)</option>
                            <option value="Frijoles cocidos (100g)|127|8.6">Frijoles cocidos 100g (127 kcal | 8.6g prot.)</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="porciones">Porciones (de 100g)</label>
                        <input type="number" id="porciones" step="0.5" min="0.5" max="20" value="1" required>
                    </div>
                </div>
                <button type="submit">Agregar al Registro</button>
            </form>
        </section>

        <section class="panel">
            <h2>Registro de Consumo</h2>
            <table>
                <thead>
                    <tr>
                        <th>Alimento</th>
                        <th>Porciones</th>
                        <th>Calorías (kcal)</th>
                        <th>Proteínas (g)</th>
                    </tr>
                </thead>
                <tbody id="tabla-nutri">
                    <tr>
                        <td colspan="4" style="text-align: center;">Aún no se han registrado alimentos.</td>
                    </tr>
                </tbody>
            </table>
            <div class="resumen-box">
                <span id="total-kcal">Total Calorías: 0.0 kcal</span>
                <span id="total-prot">Total Proteínas: 0.0 g</span>
            </div>
        </section>
    </div>

    <script>
        const formNutri = document.getElementById('form-nutri');
        const tablaNutri = document.getElementById('tabla-nutri');
        const totalKcalEl = document.getElementById('total-kcal');
        const totalProtEl = document.getElementById('total-prot');
        let registros = [];

        formNutri.addEventListener('submit', function(evento) {
            evento.preventDefault();
            const partes = document.getElementById('alimento').value.split('|');
            const nombre = partes[0];
            const kcalBase = parseFloat(partes[1]);
            const protBase = parseFloat(partes[2]);

            let porciones = parseFloat(document.getElementById('porciones').value);
            if (Number.isNaN(porciones) || porciones <= 0) {
                porciones = 1;
            }

            registros.push({
                nombre: nombre,
                porciones: porciones,
                kcal: kcalBase * porciones,
                prot: protBase * porciones
            });

            actualizarVista();
            document.getElementById('porciones').value = 1;
        });

        function actualizarVista() {
            if (registros.length === 0) {
                tablaNutri.innerHTML = '<tr><td colspan="4" style="text-align: center;">Aún no se han registrado alimentos.</td></tr>';
                totalKcalEl.textContent = 'Total Calorías: 0.0 kcal';
                totalProtEl.textContent = 'Total Proteínas: 0.0 g';
                return;
            }

            let filasHtml = '';
            let sumaKcal = 0;
            let sumaProt = 0;

            for (let i = 0; i < registros.length; i++) {
                const r = registros[i];
                sumaKcal += r.kcal;
                sumaProt += r.prot;
                filasHtml += `
                    <tr>
                        <td><strong>${r.nombre}</strong></td>
                        <td>${r.porciones}</td>
                        <td><strong>${r.kcal.toFixed(1)}</strong></td>
                        <td>${r.prot.toFixed(1)} g</td>
                    </tr>
                `;
            }

            tablaNutri.innerHTML = filasHtml;
            totalKcalEl.textContent = `Total Calorías: ${sumaKcal.toFixed(1)} kcal`;
            totalProtEl.textContent = `Total Proteínas: ${sumaProt.toFixed(1)} g`;
        }
    </script>
</body>
</html>
